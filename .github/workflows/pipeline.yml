name: Machine Learning CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main]

jobs:

  # ETAPA 1: CI (INTEGRAÇÃO CONTÍNUA)

  continuous-integration:
    name: Executar Testes de Código e Dados
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Versão do Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Configurar Cache do Pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Instalar Dependências do Projeto
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Baixar Dados do NLTK (VADER)
      run: |
        python -c "import nltk; nltk.download('vader_lexicon')"

    - name: 'CI - Testar Queries SQL (Book e ABT)'
      run: |
        python -m unittest test_database.py

    - name: 'CI - Testar Pipeline de Machine Learning'
      run: |
        python -m unittest test_modeling.py


  # ETAPA 2: CD (ENTREGA CONTÍNUA)

  continuous-deployment:
    name: Deploy do Modelo Registrado
    needs: continuous-integration
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Executar Deploy Simulado
      run: |
        echo "Pronto! O SQL está correto e o modelo passou em todos os testes unitários."
        echo "Iniciando o deploy do modelo unificado para produção..."
